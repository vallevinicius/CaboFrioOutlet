<div class="flex min-h-screen flex-col bg-white">
  <div class="sticky top-0 z-50">
    <app-announcement-bar />
    <app-navbar
      [activeCategory]="activeCategory()"
      (categoryChange)="activeCategory.set($event)"
      [searchQuery]="searchQuery()"
      (searchChange)="searchQuery.set($event)"
    />
  </div>
  <app-hero />
  <app-brand-showcase (selectBrand)="activeBrand.set($event)" />

  <main id="produtos" class="mx-auto w-full max-w-7xl flex-1 px-4 py-16 sm:px-6 lg:px-8">
    <div class="mb-8 flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
      <h2 class="text-2xl font-black tracking-tight text-slate-900">
        Nossos Produtos
      </h2>
      <app-category-filter
        [activeCategory]="activeCategory()"
        (categoryChange)="activeCategory.set($event)"
        [counts]="categoryCounts()"
      />
    </div>

    <app-product-toolbar
      [sizeOptions]="sizeOptions()"
      [brandOptions]="brands()"
      [resultCount]="filteredProducts().length"
      [(sort)]="sort"
      [(brand)]="activeBrand"
      [(sizes)]="sizes"
      [(priceMin)]="priceMin"
      [(priceMax)]="priceMax"
    />

    <app-product-grid [products]="visibleProducts()" [loading]="loading()" />

    @if (hasMore()) {
      <div class="mt-10 flex justify-center">
        <button
          type="button"
          (click)="loadMore()"
          class="rounded-sm border border-slate-900 px-8 py-3 text-sm font-bold uppercase tracking-wide text-slate-900 transition-colors duration-300 hover:bg-slate-900 hover:text-white"
        >
          Carregar mais
        </button>
      </div>
    }
  </main>

  <app-google-reviews />
  <app-store-location />
  <app-brand-banner />
  <app-footer />
  <app-cart-drawer />
</div>
