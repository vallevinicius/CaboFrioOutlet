<div class="flex min-h-screen flex-col bg-white">
  <div class="sticky top-0 z-50">
    <app-navbar
      [activeCategory]="activeCategory()"
      (categoryChange)="handleCategoryChange($event)"
      [searchQuery]="searchQuery()"
      (searchChange)="searchQuery.set($event)"
    />
  </div>

  <main class="mx-auto flex w-full max-w-2xl flex-1 flex-col items-center justify-center px-4 py-24 text-center">
    <span class="mb-6 inline-flex items-center rounded-sm bg-accent px-3.5 py-1.5 font-mono text-xs font-bold uppercase tracking-wider text-black">
      Erro 404
    </span>

    <p class="font-display text-8xl font-semibold leading-none tracking-tight text-slate-900 sm:text-9xl">
      404
    </p>

    <h1 class="mt-6 font-display text-2xl font-semibold tracking-tight text-slate-900 sm:text-3xl">
      Essa página saiu de linha.
    </h1>
    <p class="mt-3 max-w-md text-sm text-slate-500 sm:text-base">
      A página que você procura não existe ou foi removida. Mas o resto da loja continua no lugar, bora ver as novidades?
    </p>

    <button
      (click)="goHome()"
      class="mt-9 flex items-center gap-2 rounded-sm bg-accent px-7 py-4 text-sm font-bold uppercase tracking-wide text-black transition-all duration-300 hover:bg-slate-900 hover:text-white"
    >
      Voltar para a loja
    </button>
  </main>

  <app-footer />
  <app-cart-drawer />
</div>
