<section class="mx-auto max-w-7xl px-4 pb-16 sm:px-6 lg:px-8">
  <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
    @for (banner of banners; track banner.title) {
      <button
        (click)="scrollToProducts()"
        class="group relative aspect-[4/3] overflow-hidden rounded-sm text-left sm:aspect-[16/11]"
      >
        <img
          [src]="banner.image"
          [alt]="banner.title"
          loading="lazy"
          class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-105"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-black/85 via-black/20 to-transparent"></div>
        <span class="absolute bottom-6 left-6 font-display text-3xl font-semibold uppercase tracking-tight text-white sm:text-4xl">
          {{ banner.title }}
        </span>
      </button>
    }
  </div>
</section>
