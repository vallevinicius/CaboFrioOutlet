@if (settingsService.settings().brands.length > 0) {
  <section class="bg-black py-16" aria-labelledby="marcas-titulo">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <h2 id="marcas-titulo" class="font-display text-xl font-semibold uppercase tracking-wide text-accent">
        As marcas que trabalhamos
      </h2>
      <ul class="mt-6 flex flex-wrap items-baseline gap-x-6 gap-y-2">
        @for (brand of settingsService.settings().brands; track brand; let last = $last) {
          <li class="flex items-baseline gap-6">
            <button
              type="button"
              (click)="handleClick(brand)"
              class="font-display text-[clamp(3rem,9vw,7.5rem)] font-bold uppercase leading-none tracking-tight text-white transition-colors duration-300 hover:text-accent"
            >
              {{ brand }}
            </button>
            @if (!last) {
              <span class="font-display text-[clamp(2rem,6vw,5rem)] text-white/25" aria-hidden="true">/</span>
            }
          </li>
        }
      </ul>
    </div>
  </section>
}
