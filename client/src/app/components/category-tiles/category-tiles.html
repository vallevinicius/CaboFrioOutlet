<section class="mx-auto max-w-7xl px-4 py-16 sm:px-6 lg:px-8" aria-labelledby="categorias-titulo">
  <h2 id="categorias-titulo" class="mb-8 font-display text-4xl font-bold uppercase leading-none tracking-tight text-black sm:text-5xl">
    Escolha o seu estilo
  </h2>

  <div class="grid auto-rows-[200px] grid-cols-2 gap-3 sm:auto-rows-[240px] lg:auto-rows-[290px] lg:grid-cols-4">
    @for (tile of tiles; track tile.value) {
      <a
        [routerLink]="pathFor(tile.value)"
        class="group relative overflow-hidden rounded-sm bg-slate-200 text-left"
        [class]="tile.layout"
        [attr.aria-label]="'Ver ' + tile.label + ' (' + counts()[tile.value] + (counts()[tile.value] === 1 ? ' peça)' : ' peças)')"
      >
        <img
          [src]="tile.image"
          [alt]="tile.alt"
          loading="lazy"
          class="h-full w-full object-cover transition-transform duration-700 group-hover:scale-105"
        />
        <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/5 to-transparent"></div>
        <div class="absolute inset-x-0 bottom-0 p-5">
          <span class="block font-display font-bold uppercase leading-none text-white" [class]="'block font-display font-bold uppercase leading-none text-white ' + tile.titleSize">
            {{ tile.label }}
          </span>
          <span class="mt-2 block text-sm text-white/80">{{ counts()[tile.value] }} {{ counts()[tile.value] === 1 ? 'peça' : 'peças' }}</span>
          <span class="mt-3 block h-1 w-10 bg-accent transition-all duration-500 group-hover:w-24"></span>
        </div>
      </a>
    }
  </div>
</section>
