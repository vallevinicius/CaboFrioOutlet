@if (products().length > 0) {
  <section class="border-y border-slate-200 bg-slate-100 py-16" aria-labelledby="novidades-titulo">
    <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="mb-8 flex items-center gap-4">
        <h2 id="novidades-titulo" class="font-display text-4xl font-bold uppercase leading-none tracking-tight text-black sm:text-5xl">
          Chegou agora
        </h2>
        <span class="relative flex -rotate-3 items-center gap-2 rounded-sm bg-accent py-1.5 pl-2.5 pr-4 font-display text-lg font-semibold uppercase text-black">
          <span class="h-2.5 w-2.5 rounded-full border-2 border-black bg-white" aria-hidden="true"></span>
          Novo
        </span>
      </div>

      <ul class="-mx-4 flex snap-x snap-mandatory gap-4 overflow-x-auto px-4 pb-4 sm:-mx-6 sm:px-6 lg:mx-0 lg:px-0 [scrollbar-width:thin]">
        @for (product of products(); track product.id) {
          <li class="w-[250px] shrink-0 snap-start sm:w-[270px]">
            <app-product-card [product]="product" />
          </li>
        }
      </ul>
    </div>
  </section>
}
