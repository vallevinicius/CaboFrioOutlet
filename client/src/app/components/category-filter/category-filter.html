<div class="flex flex-wrap gap-2">
  @for (filter of filters; track filter.value) {
    <button
      (click)="categoryChange.emit(filter.value)"
      class="flex items-center gap-1.5 rounded-sm px-4 py-2 text-sm font-semibold transition-all duration-300"
      [class]="activeCategory() === filter.value
        ? 'bg-slate-900 text-white'
        : 'bg-white text-slate-500 border border-slate-300 hover:border-accent hover:text-slate-900'"
    >
      {{ filter.label }}
      <span class="font-mono tabular-nums" [class]="activeCategory() === filter.value ? 'text-slate-500' : 'text-slate-500'">
        {{ counts()[filter.value] }}
      </span>
    </button>
  }
</div>
